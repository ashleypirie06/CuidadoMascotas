<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cuidado de Mascotas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Registro de Mascota</h2>
    <form>
        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label>Especie:</label>
        <select id="especie">
            <option>Perro</option>
            <option>Gato</option>
            <option>Conejo</option>
            <option>Otro</option>
        </select>
        <br><br>

        <label>Raza:</label>
        <input type="text" id="raza">
        <br><br>

        <label>Edad:</label>
        <input type="numer" id="edad">
        <br><br>

        <label>Peso (kg):</label>
        <input type="number" id="peso">
        <br><br>

        <label>Fotografía:</label>
        <input type="file" id="foto" accept="image/*"> 
        <br><br>


        <h3>Alimentación y cuidados</h3>
        <label>Tipo de alimentación:</label>
        <select id="tipoAlimentacion">
            <option value="">Seleccione una opción</option>
            <option>Alimento seco</option>
            <option>Alimento húmedo</option>
            <option>Dieta especial</option>
            <option>Frutas y verduras</option>
        </select>

        <label>Horarios de alimentación:</label>
        <select id="horarios">
            <option value="">Seleccione los horarios</option>
            <option>7:00 a. m. y 4:00 p. m.</option>
            <option>8:00 a. m. y 5:00 p. m.</option>
            <option>9:00 a. m. y 6:00 p. m.</option>
            <option>7:00 a. m. y 7:00 p. m.</option>
        </select>
        <br><br>

        <label>Cuidados especiales:</label>
        <textarea type="text" id="cuidados"></textarea>
        <br><br>


        <h3>Información médica</h3>
        <label>Vacunas:</label>
        <textarea type="text" id="vacunas"></textarea>
        <br><br>

        <label>Enfermedades o alergias:</label>
        <textarea type="text" id="enfermedades"></textarea>
        <br><br>

        <label>Nombre del veterinario(a):</label>
        <input type="text" id="veterinario">
        <br><br>

        <label>Contacto del veterinario(a):</label>
        <input type="tel" id="contactoVeterinario">
        <br><br>


        <h3>Contacto de emergencia</h3>
        <label>Nombre:</label>
        <input type="text" id="contacto">
        <br><br>

        <label>Teléfono:</label>
        <input type="tel" id="telefonoEmergencia">
        <br><br>

        <button type="submit">Registrar mascota</button>
        <button type="reset">Limpiar</button>
    </form>

    <h2>Fichas de mascotas</h2>
    <div id="listaMascotas"></div>
    <script src="script.js"></script>
</body>
</html>
