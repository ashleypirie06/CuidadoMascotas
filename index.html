<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registro de mascota</h2>
    <form>
        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label>Especie:</label>
        <select id="especie">
            <option>Perro</option>
            <option>Gato</option>
            <option>Conejo</option>
            <option>Otro</option>
        </select>
        <br><br>

        <label>Raza:</label>
        <input type="text" id="raza">
        <br><br>

        <label>Edad:</label>
        <input type="numer" id="edad">
        <br><br>

        <label>Peso (kg):</label>
        <input type="number" id="peso">
        <br><br>

        <label>Fotografía:</label>
        <input type="file" id="foto" accept="image/*"> 
        <br><br>


        <h3>Alimentación y cuidados</h3>
        <label>Alimentación:</label>
        <input type="text" id="alimentacion">
        <br><br>

        <label>Horarios:</label>
        <input type="text" id="horarios">
        <br><br>

        <label>Cuidados especiales:</label>
        <textarea type="text" id="cuidados">
        <br><br>


        <h3>Información médica</h3>
        <label>Vacunas:</label>
        <textarea type="text" id="vacunas">
        <br><br>

        <label>Enfermedades o alergias:</label>
        <textarea type="text" id="enfermedades">
        <br><br>

        <label>Veterinario:</label>
        <input type="text" id="veterinario">
        <br><br>

        <label>Contacto del veterinario:</label>
        <input type="tel" id="contactoVeterinario">
        <br><br>


        <h3>Contacto de emergencia</h3>
        <label>Nombre:</label>
        <input type="text" id="contacto">
        <br><br>

        <label>Teléfono:</label>
        <input type="tel" id="telefonoEmergencia">
        <br><br>

        <label>Contacto de emergencia:</label>
        <input type="tel" id="contactoEmergencia">
        <br><br>

        <button type="submit">Registrar mascota</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
