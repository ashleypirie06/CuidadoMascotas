
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Servicios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="container mt-4">

        <header class="mb-4">
            <h1>Gestión de Servicios</h1>
            <p>Administra las solicitudes de cuidado de mascotas.</p>
        </header>

        <section class="card mb-4">

            <div class="card-header">
                <h2 class="h5 mb-0">Solicitar un servicio</h2>
            </div>

            <div class="card-body">

                <form id="formularioServicio">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="nombreCliente" class="form-label">
                                Nombre del cliente
                            </label>
                            <input type="text" class="form-control"
                                id="nombreCliente" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="nombreMascota" class="form-label">
                                Nombre de la mascota
                            </label>
                            <input type="text" class="form-control"
                                id="nombreMascota" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="tipoServicio" class="form-label">
                                Tipo de servicio
                            </label>

                            <select class="form-select" id="tipoServicio" required>
                                <option value="">Seleccione un servicio</option>
                                <option value="Paseo">Paseo</option>
                                <option value="Alimentación">Alimentación</option>
                                <option value="Baño">Baño</option>
                                <option value="Cuidado temporal">Cuidado temporal</option>
                            </select>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="fechaServicio" class="form-label">
                                Fecha
                            </label>
                            <input type="date" class="form-control"
                                id="fechaServicio" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="horaServicio" class="form-label">
                                Hora
                            </label>
                            <input type="time" class="form-control"
                                id="horaServicio" required>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-secondary">
                        Registrar solicitud
                    </button>

                </form>

            </div>
        </section>

        <section class="card">

            <div class="card-header">
                <h2 class="h5 mb-0">Solicitudes registradas</h2>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Mascota</th>
                                <th>Servicio</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="listaSolicitudes">
                            <tr>
                                <td colspan="7" class="text-center">
                                    No hay solicitudes registradas.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </section>

    </main>

    <script src="js/servicios.js"></script>

</body>
</html>
