<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETSYNC | Iniciar sesión</title>
    <link rel="stylesheet" href="css/petsync.css">
</head>
<body class="petsync">

    <header class="ps-header">
        <a href="index.html" class="ps-logo">🐾 PETSYNC</a>
        <nav class="ps-nav" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="login.html" class="activo" aria-current="page">Ingresar</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main class="ps-contenedor">
        <form id="formLogin" class="ps-formulario">
            <h1>Iniciar sesión</h1>
            <p>Bienvenido a PETSYNC.</p>

            <div class="ps-aviso">
                Acceso demostrativo. Todavía no se verifican
                credenciales mediante un servidor.
            </div>

            <div class="ps-campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                       placeholder="correo@ejemplo.com"
                       autocomplete="email" required>
            </div>

            <div class="ps-campo">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave"
                       minlength="8" autocomplete="current-password"
                       required>
            </div>

            <div class="ps-campo">
                <label for="rol">Vista de usuario</label>
                <select id="rol" name="rol" required>
                    <option value="propietario">Propietario</option>
                    <option value="cuidador">Cuidador</option>
                </select>
            </div>

            <button class="ps-boton" type="submit">
                Entrar en modo demostración
            </button>

            <p>
                ¿No tienes cuenta?
                <a href="registro.html">Ir al registro</a>
            </p>
        </form>
    </main>

    <footer class="ps-footer">
        PETSYNC | Proyecto académico
    </footer>

    <script src="js/petsync.js"></script>
</body>
</html>
